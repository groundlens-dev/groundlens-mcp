[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundlens-mcp"
dynamic = ["version"]
description = "MCP server for groundlens — LLM hallucination detection for Claude Desktop, Cursor, Windsurf, and any MCP client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Javier Marin", email = "javier@jmarin.info" },
]
keywords = [
    "mcp",
    "hallucination",
    "llm",
    "grounding",
    "groundlens",
    "claude-desktop",
    "cursor",
    "windsurf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "groundlens>=2026.7.6",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://groundlens.dev"
Documentation = "https://docs.groundlens.dev"
Repository = "https://github.com/groundlens-dev/groundlens-mcp"
Issues = "https://github.com/groundlens-dev/groundlens-mcp/issues"

[project.scripts]
groundlens-mcp = "groundlens_mcp.server:main"

[tool.hatch.version]
path = "src/groundlens_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/groundlens_mcp"]
