[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundlens-mcp"
version = "3.0.0"
description = "Deprecated. The groundlens MCP connector now ships inside groundlens itself."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Javier Marin" }]
keywords = ["deprecated", "groundlens", "mcp"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# Deliberately empty. A tombstone that pulls a dependency tree is not a
# tombstone. Anyone who lands here should install groundlens directly.
dependencies = []

[project.scripts]
groundlens-mcp = "groundlens_mcp:main"

[project.urls]
Homepage = "https://groundlens.dev"
Source = "https://github.com/groundlens-dev/groundlens"

[tool.hatch.build.targets.wheel]
packages = ["src/groundlens_mcp"]
